# Add inside the existing `server { server_name figure.rebuilder.ai; ... }` block (TLS already terminated there).
# The app serves both the UI (/3dgen/) and the API (/3dgen/api/) itself, so one prefix-preserving proxy is enough.
location = /3dgen { return 301 /3dgen/; }
location /3dgen/ {
    proxy_pass http://127.0.0.1:8030;          # no trailing slash: keep the /3dgen prefix
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 160m;                  # photo + GLB upload
    proxy_read_timeout 300s;
}
